name: Generate Trophy
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=arqamali153-afk&theme=tokyonight&no-frame=true&margin-w=8&row=1&column=6'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
