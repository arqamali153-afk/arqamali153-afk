  name: generate snake animation
  on:
    schedule:
      - cron: "0 0 * * *"
    workflow_dispatch:
    push:
      branches:
        - main
  jobs:
    generate:
      runs-on: ubuntu-latest
      steps:
        - uses: Platane/snk@v3
          id: snake
          with:
            github_user_name: arqamali153-afk
            outputs: |
              dist/github-contribution-grid-snake.svg
              dist/github-contribution-grid-snake-dark.svg?color_snake=#a277ff&color_dots=#ebedf0,#1f5751,#2d857a,#3cbaaa,#4cebd8
        - uses: crazy-max/ghaction-github-pages@v3
          with:
            target_branch: output
            build_dir: dist
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
